<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Project Home — Inkable Studios</title>
<style>
  :root{
    --black:#0a0a0a; --panel:#151515; --panel2:#1c1c1c; --border:#272727;
    --text:#f2f2f0; --muted:#9a9a95; --muted2:#66655f;
    --blue:#2f8fe8; --green:#4caf50;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'DM Sans',system-ui,-apple-system,sans-serif;
    background:var(--black); color:var(--text); line-height:1.45;
    background-image:radial-gradient(ellipse 900px 500px at 50% 0%, #10233a 0%, var(--black) 70%);
    background-repeat:no-repeat;
  }
  .wrap{max-width:720px; margin:0 auto; padding:0 24px 40px}

  header{display:flex; align-items:center; justify-content:space-between; padding:26px 0 20px}
  header img{height:52px; width:auto; display:block}
  .tagline{color:var(--muted); font-size:12px; text-align:right}

  .jobhead{
    border:1px solid var(--border); border-radius:12px; padding:16px 18px 14px;
    background:linear-gradient(180deg,#171717,var(--panel));
  }
  .jobhead-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
  .jobhead-top .client{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em}
  .jobhead-top h1{font-size:18px; margin:3px 0 0; font-weight:700; letter-spacing:-0.01em}
  .estno{font-family:'DM Mono',monospace; font-size:11px; color:var(--muted2); margin-top:4px}
  .statuspill{
    flex-shrink:0; font-size:10.5px; font-weight:700; padding:5px 11px; border-radius:20px;
    white-space:nowrap;
  }
  .jobhead-meta{display:flex; gap:20px; margin-top:13px; padding-top:12px; border-top:1px solid var(--border)}
  .jobhead-meta div{font-size:11.5px}
  .jobhead-meta .lbl{color:var(--muted2); margin-bottom:1px}
  .jobhead-meta .val{color:var(--text); font-weight:600}

  section{margin-top:20px}
  .sectiontitle{font-size:14px; font-weight:700; margin-bottom:2px}
  .sectionsub{font-size:12px; color:var(--muted); margin-bottom:11px}

  iframe.proofbox{width:100%; height:340px; border-radius:11px; border:1px solid var(--border); background:#525659}
  .newtab{display:inline-block; margin-top:8px; font-size:11.5px; color:var(--blue); text-decoration:none}
  .actions{display:flex; gap:9px; margin-top:13px}
  .actions button{
    flex:1; font-family:inherit; font-size:13.5px; font-weight:700; padding:11px 14px;
    border-radius:9px; border:none; cursor:pointer; transition:filter .15s;
  }
  .actions button:hover{filter:brightness(1.08)}
  .btn-approve{background:var(--green); color:#08210a}
  .btn-changes{background:var(--panel2); color:var(--text); border:1px solid var(--border) !important}
  .btn-primary{background:var(--blue); color:#04162b}
  .btn-ghost{background:none; color:var(--muted); border:1px solid var(--border)}
  textarea{
    width:100%; min-height:70px; margin-top:10px; padding:10px; border-radius:8px;
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    font-family:inherit; font-size:12.5px; resize:vertical;
  }
  #changesForm,#approveConfirm{display:none}
  .already-badge{display:inline-block; font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:6px; margin-bottom:10px}
  .already-approved{background:#1b3a1e; color:var(--green)}
  .already-changes{background:#3a2a1b; color:#f0ad4e}

  .estimate{border:1px solid var(--border); border-radius:11px; overflow:hidden}
  .estimate-toggle{
    width:100%; display:flex; justify-content:space-between; align-items:center;
    padding:13px 16px; background:var(--panel); border:none; color:var(--text);
    font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
  }
  .estimate-toggle .caret{color:var(--muted2); font-size:10.5px; transition:transform .15s}
  .estimate-toggle.open .caret{transform:rotate(180deg)}
  .estimate-body{display:none; padding:0 16px 16px}
  .estimate-body.open{display:block}
  .lineitem{display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid var(--border); font-size:12.5px}
  .lineitem .desc{color:var(--text)}
  .lineitem .spec{color:var(--muted2); font-size:11px; margin-top:2px}
  .lineitem .price{color:var(--text); font-weight:600; flex-shrink:0; margin-left:14px}
  .estimate-totals{border-top:1px solid var(--border); padding-top:10px; margin-top:2px}
  .totrow{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); padding:2px 0}
  .totrow.final{color:var(--text); font-weight:700; font-size:14px; padding-top:7px}

  footer{text-align:center; margin-top:28px; font-size:10.5px; color:var(--muted2)}
  .state-msg{text-align:center; padding:40px 20px; color:var(--muted); font-size:13px}
  .state-msg.error{color:#e57373}

  @media (max-width:480px){
    .jobhead-top{flex-direction:column}
    .statuspill{align-self:flex-start}
  }
</style>
</head>

<script>
  const STATUS_META = {

  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const API_BASE = window.location.origin + '/api/proof-public';
  const card = document.getElementById('mainCard');

  function fmtMoney(n){ return '$' + (n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function fmtDate(s){
    if(!s) return '';
    const d = new Date(s);
    return isNaN(d) ? s : d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  }

  function showError(msg){
    card.innerHTML = `<div class="state-msg error">${msg}</div>`;
  }

  function jobHeadHtml(data){

        <div class="jobhead-top">
          <div>
            ${data.clientName ? `<div class="client">${data.clientName}</div>` : ''}
            <h1>${data.jobName}</h1>
            ${data.estNo ? `<div class="estno">${data.estNo}</div>` : ''}
          </div>
          <div class="statuspill" style="background:${meta.color}22;color:${meta.color}">${meta.label}</div>
        </div>
        <div class="jobhead-meta">
          ${data.requestedDate ? `<div><div class="lbl">Requested</div><div class="val">${fmtDate(data.requestedDate)}</div></div>` : ''}
          ${data.installDate ? `<div><div class="lbl">Est. install</div><div class="val">${fmtDate(data.installDate)}</div></div>` : ''}
          ${data.estimateSummary ? `<div><div class="lbl">Total</div><div class="val">${fmtMoney(data.estimateSummary.total)}</div></div>` : ''}
        </div>
      </div>`;
  }

  function estimateHtml(summary){
    if(!summary) return '';
    const lines = (summary.lineItems||[]).map(l => `
      <div class="lineitem">
        <div>
          <div class="desc">${l.desc}</div>
          ${l.sqft > 0 ? `<div class="spec">${l.sqft.toFixed(2)} sqft</div>` : ''}
        </div>
        <div class="price">${fmtMoney(l.matTotal)}</div>
      </div>`).join('');
    const extraRows = [
      summary.setupTotal > 0 ? ['Setup', summary.setupTotal] : null,
      summary.designTotal > 0 ? ['Design & Prep', summary.designTotal] : null,
      summary.totalInstall > 0 ? ['Installation', summary.totalInstall] : null,
      summary.hardwareTotal > 0 ? ['Hardware & Misc', summary.hardwareTotal] : null,
      summary.disc > 0 ? ['Discount', -summary.disc] : null,
    ].filter(Boolean).map(([lbl,amt]) => `<div class="totrow"><span>${lbl}</span><span>${fmtMoney(amt)}</span></div>`).join('');

    return `
      <section>
        <div class="estimate">
          <button class="estimate-toggle" id="estimateToggle">
            <span>View estimate details</span><span class="caret">▾</span>
          </button>
          <div class="estimate-body" id="estimateBody">
            ${lines}
            <div class="estimate-totals">
              ${extraRows}
              <div class="totrow"><span>Subtotal</span><span>${fmtMoney(summary.sub - (summary.disc||0))}</span></div>
              <div class="totrow"><span>${summary.taxExempt ? 'Sales Tax (Exempt)' : 'Sales Tax'}</span><span>${fmtMoney(summary.tax)}</span></div>
              <div class="totrow final"><span>Total</span><span>${fmtMoney(summary.total)}</span></div>
            </div>
          </div>
        </div>
      </section>`;
  }

  async function submitResponse(response, note){
    try{
      const res = await fetch(API_BASE + '?token=' + encodeURIComponent(token), {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({response, note}),
      });
      if(!res.ok) throw new Error();
      load(); // reload to show the "already responded" state from the server
    }catch(e){
      alert("That didn't go through — check your connection and try again.");
    }
  }

  function proofSectionHtml(data){
    if(data.response){
      const isApproved = data.response === 'approved';
      return `
        <section>
          <div class="sectiontitle">Proof</div>
          <span class="already-badge ${isApproved?'already-approved':'already-changes'}">
            ${isApproved ? '✓ You approved this proof' : '✎ You requested changes'}
          </span>
          ${data.responseNote ? `<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">Your note: "${data.responseNote}"</div>` : ''}
          <iframe class="proofbox" src="${data.proofEmbedUrl}"></iframe>
          <a class="newtab" href="${data.proofEmbedUrl.replace('/preview','/view')}" target="_blank" rel="noopener">Open in a new tab ↗</a>
        </section>`;
    }
    return `
      <section>
        <div class="sectiontitle">Review your proof</div>
        <div class="sectionsub">Take a look and let us know — approve it, or tell us what to change.</div>
        <iframe class="proofbox" src="${data.proofEmbedUrl}"></iframe>
        <a class="newtab" href="${data.proofEmbedUrl.replace('/preview','/view')}" target="_blank" rel="noopener">Open in a new tab ↗</a>
        <div class="actions" id="mainActions">
          <button class="btn-approve" id="approveBtn">✓ Approve</button>
          <button class="btn-changes" id="changesBtn">✎ Request Changes</button>
        </div>
        <div id="approveConfirm">
          <div style="font-size:12.5px;color:var(--text);margin-top:12px;text-align:center">
            Approve this proof? We'll move forward with production.
          </div>
          <div class="actions">
            <button class="btn-ghost" id="cancelApproveBtn">Cancel</button>
            <button class="btn-approve" id="confirmApproveBtn">Yes, Approve</button>
          </div>
        </div>
        <div id="changesForm">
          <textarea id="changesNote" placeholder="What would you like changed?"></textarea>
          <div class="actions">
            <button class="btn-ghost" id="cancelChangesBtn">Cancel</button>
            <button class="btn-primary" id="submitChangesBtn">Submit</button>
          </div>
        </div>
      </section>`;
  }

  function wireProofActions(data){
    if(data.response) return; // already responded — no action buttons to wire
    document.getElementById('approveBtn').onclick = () => {
      document.getElementById('mainActions').style.display = 'none';
      document.getElementById('approveConfirm').style.display = 'block';
    };
    document.getElementById('cancelApproveBtn').onclick = () => {
      document.getElementById('approveConfirm').style.display = 'none';
      document.getElementById('mainActions').style.display = 'flex';
    };
    document.getElementById('confirmApproveBtn').onclick = () => submitResponse('approved', '');
    document.getElementById('changesBtn').onclick = () => {
      document.getElementById('changesForm').style.display = 'block';
    };
    document.getElementById('cancelChangesBtn').onclick = () => {
      document.getElementById('changesForm').style.display = 'none';
    };
    document.getElementById('submitChangesBtn').onclick = () => {
      const note = document.getElementById('changesNote').value.trim();
      if(!note){ alert('Add a quick note about what should change.'); return; }
      submitResponse('changes', note);
    };
  }

  function render(data){
    card.innerHTML = jobHeadHtml(data) + proofSectionHtml(data) + estimateHtml(data.estimateSummary);
    wireProofActions(data);
    const toggle = document.getElementById('estimateToggle');
    if(toggle){
      toggle.onclick = function(){
        this.classList.toggle('open');
        document.getElementById('estimateBody').classList.toggle('open');
      };
    }
  }

  async function load(){
    if(!token){ showError("This link is missing something — check that you copied the whole URL."); return; }
    try{
      const res = await fetch(API_BASE + '?token=' + encodeURIComponent(token));
      const data = await res.json();
      if(!res.ok){ showError(data.error || "This link isn't working right now."); return; }
      render(data);
    }catch(e){
      showError("Couldn't load your job — check your connection and try again.");
    }
  }

  load();
</script>
</body>
</html>
